<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-black">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Amoled Music Player</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3844/3844724.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .amoled-card {
      background-color: #050505;
      border: 1px solid #18181b;
    }
    .amoled-drawer {
      background-color: #000000;
      border-left: 1px solid #18181b;
    }
    input[type="range"] {
      accent-color: #3b82f6;
    }
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.03); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .album-pulse {
      animation: pulse-ring 4s infinite ease-in-out;
    }
  </style>
</head>
<body class="h-full w-full flex flex-col justify-between select-none antialiased">

  <header class="w-full h-14 px-4 flex items-center justify-between border-b border-zinc-900 bg-black z-10 flex-shrink-0">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-sm shadow-lg shadow-blue-500/20">
        <i class="fa-solid fa-compact-disc fa-spin" id="header-disc" style="animation-duration: 4s; animation-play-state: paused;"></i>
      </div>
      <span class="font-bold tracking-wider text-sm sm:text-base text-zinc-100 uppercase">AMP<span class="text-blue-500">Player</span></span>
    </div>
    <div class="flex items-center space-x-2">
      <button id="btn-open-drawer" class="p-2.5 rounded-full bg-zinc-900 border border-zinc-800 text-zinc-200 hover:text-white hover:bg-zinc-800 active:scale-95 transition flex items-center justify-center text-lg w-10 h-10 shadow-md">
        🎶
      </button>
    </div>
  </header>

  <main class="flex-1 w-full max-w-5xl mx-auto p-4 sm:p-6 flex flex-col md:flex-row items-center justify-center gap-6 overflow-hidden">
    
    <div class="w-full md:w-1/2 flex flex-col items-center justify-center max-h-[42vh] md:max-h-full">
      <div class="relative aspect-square w-full max-w-[260px] sm:max-w-[320px] md:max-w-[360px] rounded-3xl amoled-card p-4 flex items-center justify-center shadow-2xl shadow-blue-950/20 group">
        <div id="album-cover" class="w-full h-full rounded-2xl bg-gradient-to-br from-zinc-900 via-zinc-950 to-black flex flex-col items-center justify-center relative overflow-hidden border border-zinc-800/60 album-pulse">
          <div class="absolute inset-0 bg-blue-600/5 backdrop-blur-3xl"></div>
          <i id="album-icon" class="fa-solid fa-music text-6xl sm:text-7xl text-zinc-700 transition-all duration-300"></i>
          
          <div id="visualizer-container" class="absolute bottom-4 left-0 right-0 h-10 flex items-end justify-center gap-1.5 px-6 opacity-80">
            <div class="viz-bar w-1.5 bg-blue-500 rounded-t h-2 transition-all duration-75"></div>
            <div class="viz-bar w-1.5 bg-blue-400 rounded-t h-2 transition-all duration-75"></div>
            <div class="viz-bar w-1.5 bg-indigo-500 rounded-t h-2 transition-all duration-75"></div>
            <div class="viz-bar w-1.5 bg-blue-600 rounded-t h-2 transition-all duration-75"></div>
            <div class="viz-bar w-1.5 bg-sky-400 rounded-t h-2 transition-all duration-75"></div>
            <div class="viz-bar w-1.5 bg-blue-500 rounded-t h-2 transition-all duration-75"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="w-full md:w-1/2 flex flex-col justify-center space-y-4 sm:space-y-6 max-w-md">
      
      <div class="text-center md:text-left space-y-1">
        <h1 id="track-title" class="text-xl sm:text-2xl font-black text-white truncate tracking-tight">Nenhuma Música</h1>
        <p id="track-artist" class="text-sm text-zinc-400 truncate font-medium">Importe seus arquivos MP3/WAV</p>
        <span id="current-playlist-tag" class="inline-block text-[10px] bg-blue-950 text-blue-400 border border-blue-800/50 px-2 py-0.5 rounded-full font-mono mt-1 hidden"></span>
      </div>

      <div class="space-y-2 w-full">
        <input type="range" id="seek-bar" min="0" max="100" value="0" class="w-full h-1.5 bg-zinc-800 rounded-lg appearance-none cursor-pointer">
        <div class="flex justify-between text-xs font-mono text-zinc-500">
          <span id="current-time">0:00</span>
          <span id="total-duration">0:00</span>
        </div>
      </div>

      <div class="flex items-center justify-between px-2">
        <button id="btn-shuffle" class="text-zinc-500 hover:text-zinc-200 transition text-sm p-2 active:scale-95">
          <i class="fa-solid fa-shuffle"></i>
        </button>
        
        <button id="btn-prev" class="text-zinc-300 hover:text-white transition text-xl p-2 active:scale-90">
          <i class="fa-solid fa-backward-step"></i>
        </button>

        <button id="btn-play-pause" class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-blue-600 text-white flex items-center justify-center text-xl sm:text-2xl shadow-lg shadow-blue-600/30 hover:bg-blue-500 active:scale-95 transition">
          <i id="play-icon" class="fa-solid fa-play ml-1"></i>
        </button>

        <button id="btn-next" class="text-zinc-300 hover:text-white transition text-xl p-2 active:scale-90">
          <i class="fa-solid fa-forward-step"></i>
        </button>

        <button id="btn-repeat" class="text-zinc-500 hover:text-zinc-200 transition text-sm p-2 relative active:scale-95">
          <i class="fa-solid fa-repeat"></i>
          <span id="repeat-badge" class="hidden absolute -top-1 -right-1 text-[9px] bg-blue-600 text-white rounded-full w-3.5 h-3.5 flex items-center justify-center font-bold">1</span>
        </button>
      </div>

      <div class="grid grid-cols-2 gap-3 pt-2">
        <div class="flex items-center space-x-2 amoled-card px-3 py-2 rounded-xl">
          <button id="btn-mute" class="text-zinc-400 hover:text-white transition text-sm">
            <i id="volume-icon" class="fa-solid fa-volume-high"></i>
          </button>
          <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="0.8" class="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer">
        </div>

        <div class="flex items-center justify-between amoled-card px-3 py-2 rounded-xl">
          <span class="text-xs text-zinc-500 font-semibold uppercase tracking-wider">Velocidade</span>
          <select id="speed-select" class="bg-transparent text-xs text-blue-400 font-bold focus:outline-none cursor-pointer">
            <option value="0.5" class="bg-zinc-950 text-white">0.5x</option>
            <option value="1.0" selected class="bg-zinc-950 text-white">1.0x</option>
            <option value="1.25" class="bg-zinc-950 text-white">1.25x</option>
            <option value="1.5" class="bg-zinc-950 text-white">1.5x</option>
            <option value="2.0" class="bg-zinc-950 text-white">2.0x</option>
          </select>
        </div>
      </div>

    </div>
  </main>

  <footer class="w-full flex-shrink-0 flex flex-col items-center justify-center pb-2 pt-1 bg-black border-t border-zinc-950 z-10">
    <div class="text-[11px] font-semibold text-zinc-500 tracking-wider hover:text-blue-400 transition cursor-default mb-1">
      Made By: <span class="text-zinc-300 font-bold">@085_Teuzinnn</span>
    </div>
    <div class="w-32 h-1 bg-zinc-800 rounded-full sm:hidden"></div>
  </footer>

  <div id="drawer-overlay" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-40 hidden transition-opacity duration-300 opacity-0"></div>
  
  <aside id="playlist-drawer" class="fixed top-0 right-0 bottom-0 w-full max-w-md amoled-drawer z-50 flex flex-col transform translate-x-full transition-transform duration-300 ease-in-out">
    
    <div class="p-4 border-b border-zinc-900 flex items-center justify-between flex-shrink-0 bg-black">
      <div class="flex items-center space-x-2">
        <span class="text-xl">🎶</span>
        <h2 class="font-bold text-lg text-white">Biblioteca</h2>
        <span id="track-count" class="text-xs bg-zinc-900 text-zinc-400 px-2 py-0.5 rounded-full border border-zinc-800">0</span>
      </div>
      <div class="flex items-center space-x-2">
        <button id="btn-open-modal-playlist" class="p-2 bg-zinc-900 hover:bg-zinc-800 text-blue-400 border border-zinc-800 rounded-xl text-xs font-semibold flex items-center space-x-1.5 active:scale-95 transition">
          <i class="fa-solid fa-plus"></i>
          <span>Criar</span>
        </button>

        <label for="file-input" class="p-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl cursor-pointer text-sm font-semibold flex items-center space-x-1.5 active:scale-95 transition shadow-md shadow-blue-600/20">
          <span>📥</span>
          <span class="text-xs">Importar</span>
        </label>
        <input type="file" id="file-input" multiple accept="audio/*" class="hidden">
        
        <button id="btn-close-drawer" class="p-2 text-zinc-400 hover:text-white rounded-xl hover:bg-zinc-900 transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
    </div>

    <div class="flex border-b border-zinc-900 bg-black px-4 pt-2 text-xs font-semibold gap-4">
      <button id="tab-all" class="pb-2 border-b-2 border-blue-500 text-blue-400">Todas Músicas</button>
      <button id="tab-playlists" class="pb-2 border-b-2 border-transparent text-zinc-500 hover:text-zinc-300">Playlists Criadas</button>
    </div>

    <div class="p-4 border-b border-zinc-900 bg-black flex-shrink-0">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-500 text-sm"></i>
        <input type="text" id="search-input" placeholder="Pesquisar..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl pl-9 pr-4 py-2 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-blue-500 transition">
      </div>
    </div>

    <div id="playlist-container" class="flex-1 overflow-y-auto p-4 space-y-2 scrollbar-none">
      <div id="empty-state" class="h-full flex flex-col items-center justify-center text-center p-6 text-zinc-600">
        <i class="fa-solid fa-music text-4xl mb-3 opacity-40"></i>
        <p class="text-sm font-medium">Nenhum item encontrado.</p>
        <p class="text-xs mt-1 text-zinc-700">Importe arquivos ou crie uma nova playlist para começar.</p>
      </div>
      <ul id="track-list" class="space-y-1.5"></ul>
    </div>

  </aside>

  <div id="playlist-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-zinc-950 border border-zinc-800 w-full max-w-md rounded-2xl p-5 flex flex-col space-y-4 max-h-[85vh]">
      <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
        <h3 class="font-bold text-lg text-white">Criar Playlist Customizada</h3>
        <button id="btn-close-modal" class="text-zinc-500 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <div>
        <label class="text-xs text-zinc-400 font-semibold mb-1 block">Nome da Playlist</label>
        <input type="text" id="playlist-name-input" placeholder="Ex: Minhas Favoritas, Treino..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
      </div>

      <div class="flex-1 overflow-hidden flex flex-col min-h-[180px]">
        <label class="text-xs text-zinc-400 font-semibold mb-1 block">Selecione as Músicas</label>
        <div id="modal-song-selection" class="flex-1 overflow-y-auto border border-zinc-900 bg-black rounded-xl p-2 space-y-1 scrollbar-none">
        </div>
      </div>

      <div class="flex justify-end space-x-2 pt-2 border-t border-zinc-900">
        <button id="btn-cancel-modal" class="px-4 py-2 bg-zinc-900 text-zinc-400 rounded-xl text-xs font-bold hover:bg-zinc-800 hover:text-white">Cancelar</button>
        <button id="btn-save-playlist" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold hover:bg-blue-500 shadow-lg shadow-blue-600/30">Salvar Playlist</button>
      </div>
    </div>
  </div>

  <audio id="audio-engine" class="hidden"></audio>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log(reg))
          .catch(err => console.log(err));
      });
    }

    const audio = document.getElementById('audio-engine');
    const btnPlayPause = document.getElementById('btn-play-pause');
    const playIcon = document.getElementById('play-icon');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnShuffle = document.getElementById('btn-shuffle');
    const btnRepeat = document.getElementById('btn-repeat');
    const repeatBadge = document.getElementById('repeat-badge');
    const seekBar = document.getElementById('seek-bar');
    const volumeBar = document.getElementById('volume-bar');
    const btnMute = document.getElementById('btn-mute');
    const volumeIcon = document.getElementById('volume-icon');
    const speedSelect = document.getElementById('speed-select');
    const currentTimeEl = document.getElementById('current-time');
    const totalDurationEl = document.getElementById('total-duration');
    const trackTitleEl = document.getElementById('track-title');
    const trackArtistEl = document.getElementById('track-artist');
    const headerDisc = document.getElementById('header-disc');
    const albumIcon = document.getElementById('album-icon');
    const albumCover = document.getElementById('album-cover');
    const vizBars = document.querySelectorAll('.viz-bar');
    const currentPlaylistTag = document.getElementById('current-playlist-tag');

    const btnOpenDrawer = document.getElementById('btn-open-drawer');
    const btnCloseDrawer = document.getElementById('btn-close-drawer');
    const drawerOverlay = document.getElementById('drawer-overlay');
    const playlistDrawer = document.getElementById('playlist-drawer');
    const fileInput = document.getElementById('file-input');
    const searchInput = document.getElementById('search-input');
    const trackListEl = document.getElementById('track-list');
    const emptyStateEl = document.getElementById('empty-state');
    const trackCountEl = document.getElementById('track-count');

    const tabAll = document.getElementById('tab-all');
    const tabPlaylists = document.getElementById('tab-playlists');
    const btnOpenModal = document.getElementById('btn-open-modal-playlist');
    const btnCloseModal = document.getElementById('btn-close-modal');
    const btnCancelModal = document.getElementById('btn-cancel-modal');
    const btnSavePlaylist = document.getElementById('btn-save-playlist');
    const playlistModal = document.getElementById('playlist-modal');
    const playlistNameInput = document.getElementById('playlist-name-input');
    const modalSongSelection = document.getElementById('modal-song-selection');

    let allSongs = []; 
    let activePlaylist = []; 
    let customPlaylists = []; 
    let currentViewTab = 'all'; 
    let activePlaylistName = "Todas"; 

    let currentTrackIndex = -1;
    let isShuffle = false;
    let repeatState = 0; 
    let lastVolume = 0.8;
    let vizInterval = null;

    const gradients = [
      'from-blue-900 via-indigo-950 to-black',
      'from-purple-900 via-zinc-950 to-black',
      'from-emerald-900 via-teal-950 to-black',
      'from-rose-900 via-zinc-950 to-black',
      'from-amber-900 via-zinc-950 to-black',
      'from-cyan-900 via-blue-950 to-black',
      'from-fuchsia-900 via-purple-950 to-black',
      'from-violet-900 via-slate-950 to-black'
    ];

    const icons = ['fa-music', 'fa-compact-disc', 'fa-headphones', 'fa-record-vinyl', 'fa-radio', 'fa-guitar'];

    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('AMPPlayerDB', 2);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('songs')) {
            db.createObjectStore('songs', { keyPath: 'fileName' });
          }
          if (!db.objectStoreNames.contains('playlists')) {
            db.createObjectStore('playlists', { keyPath: 'name' });
          }
        };
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => reject(e.target.error);
      });
    }

    async function saveSongToDB(song) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('songs', 'readwrite');
        tx.objectStore('songs').put(song);
        tx.oncomplete = () => resolve();
        tx.onerror = (e) => reject(e.target.error);
      });
    }

    async function deleteSongFromDB(fileName) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('songs', 'readwrite');
        tx.objectStore('songs').delete(fileName);
        tx.oncomplete = () => resolve();
        tx.onerror = (e) => reject(e.target.error);
      });
    }

    async function getAllSongsFromDB() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const req = db.transaction('songs', 'readonly').objectStore('songs').getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = (e) => reject(e.target.error);
      });
    }

    async function savePlaylistToDB(playlist) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('playlists', 'readwrite');
        tx.objectStore('playlists').put(playlist);
        tx.oncomplete = () => resolve();
        tx.onerror = (e) => reject(e.target.error);
      });
    }

    async function deletePlaylistFromDB(name) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('playlists', 'readwrite');
        tx.objectStore('playlists').delete(name);
        tx.oncomplete = () => resolve();
        tx.onerror = (e) => reject(e.target.error);
      });
    }

    async function getAllPlaylistsFromDB() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const req = db.transaction('playlists', 'readonly').objectStore('playlists').getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = (e) => reject(e.target.error);
      });
    }

    async function initIndexedDB() {
      try {
        const storedSongs = await getAllSongsFromDB();
        storedSongs.forEach(song => {
          song.url = URL.createObjectURL(song.blob);
          allSongs.push(song);
        });
        
        customPlaylists = await getAllPlaylistsFromDB();
        activePlaylist = [...allSongs];

        renderCurrentView();
        if (allSongs.length > 0) {
          loadTrack(0);
        }
      } catch (err) {
        console.error("Erro no DB:", err);
      }
    }

    function toggleDrawer(open) {
      if (open) {
        drawerOverlay.classList.remove('hidden');
        setTimeout(() => {
          drawerOverlay.classList.remove('opacity-0');
          playlistDrawer.classList.remove('translate-x-full');
        }, 10);
      } else {
        playlistDrawer.classList.add('translate-x-full');
        drawerOverlay.classList.add('opacity-0');
        setTimeout(() => drawerOverlay.classList.add('hidden'), 300);
      }
    }

    btnOpenDrawer.addEventListener('click', () => toggleDrawer(true));
    btnCloseDrawer.addEventListener('click', () => toggleDrawer(false));
    drawerOverlay.addEventListener('click', () => toggleDrawer(false));

    fileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      for (const file of files) {
        const fileName = file.name;
        const existingIndex = allSongs.findIndex(p => p.fileName === fileName);
        
        const songData = {
          fileName: fileName,
          title: fileName.replace(/\.[^/.]+$/, ""),
          artist: "Arquivo Local",
          gradient: gradients[Math.floor(Math.random() * gradients.length)],
          icon: icons[Math.floor(Math.random() * icons.length)],
          blob: file
        };

        await saveSongToDB(songData);
        songData.url = URL.createObjectURL(file);

        if (existingIndex !== -1) {
          if (allSongs[existingIndex].url) URL.revokeObjectURL(allSongs[existingIndex].url);
          allSongs[existingIndex] = songData;
        } else {
          allSongs.push(songData);
        }
      }

      if (activePlaylistName === "Todas") {
        activePlaylist = [...allSongs];
      }

      renderCurrentView();
      if (currentTrackIndex === -1 && activePlaylist.length > 0) {
        loadTrack(0);
      }
      fileInput.value = '';
    });

    tabAll.addEventListener('click', () => {
      currentViewTab = 'all';
      tabAll.className = "pb-2 border-b-2 border-blue-500 text-blue-400";
      tabPlaylists.className = "pb-2 border-b-2 border-transparent text-zinc-500 hover:text-zinc-300";
      renderCurrentView();
    });

    tabPlaylists.addEventListener('click', () => {
      currentViewTab = 'playlists';
      tabPlaylists.className = "pb-2 border-b-2 border-blue-500 text-blue-400";
      tabAll.className = "pb-2 border-b-2 border-transparent text-zinc-500 hover:text-zinc-300";
      renderCurrentView();
    });

    searchInput.addEventListener('input', () => renderCurrentView());

    function renderCurrentView() {
      if (currentViewTab === 'all') {
        renderSongsList();
      } else {
        renderPlaylistsList();
      }
    }

    function renderSongsList() {
      const query = searchInput.value.toLowerCase().trim();
      const filtered = allSongs.filter(t => t.title.toLowerCase().includes(query) || t.artist.toLowerCase().includes(query));

      trackCountEl.textContent = allSongs.length;
      trackListEl.innerHTML = '';

      if (filtered.length === 0) {
        emptyStateEl.classList.remove('hidden');
        return;
      }
      emptyStateEl.classList.add('hidden');

      filtered.forEach((track) => {
        const realIndex = activePlaylist.findIndex(t => t.fileName === track.fileName);
        const isCurrent = realIndex === currentTrackIndex && activePlaylistName === "Todas";

        const li = document.createElement('li');
        li.className = `p-3 rounded-xl flex items-center justify-between cursor-pointer border transition ${
          isCurrent ? 'bg-blue-950/40 border-blue-600/50 text-white' : 'bg-zinc-950 border-zinc-900 text-zinc-300 hover:bg-zinc-900'
        }`;

        li.innerHTML = `
          <div class="flex items-center space-x-3 overflow-hidden flex-1 mr-2">
            <div class="w-8 h-8 rounded-lg ${isCurrent ? 'bg-blue-600 text-white' : 'bg-zinc-900 text-zinc-500'} flex items-center justify-center flex-shrink-0 text-xs font-bold">
              ${isCurrent && !audio.paused ? '<i class="fa-solid fa-waveform fa-bounce"></i>' : (allSongs.indexOf(track) + 1)}
            </div>
            <div class="overflow-hidden">
              <p class="text-sm font-bold truncate ${isCurrent ? 'text-blue-400' : 'text-zinc-200'}">${escapeHtml(track.title)}</p>
              <p class="text-xs text-zinc-500 truncate">${escapeHtml(track.artist)}</p>
            </div>
          </div>
          <button data-filename="${escapeHtml(track.fileName)}" class="btn-delete-track p-2 text-zinc-600 hover:text-red-500 rounded-lg">
            <i class="fa-solid fa-trash-can text-sm"></i>
          </button>
        `;

        li.addEventListener('click', (e) => {
          if (e.target.closest('.btn-delete-track')) return;
          playAllMode(track.fileName);
        });

        li.querySelector('.btn-delete-track').addEventListener('click', (e) => {
          e.stopPropagation();
          deleteTrack(track.fileName);
        });

        trackListEl.appendChild(li);
      });
    }

    function playAllMode(fileName) {
      activePlaylist = [...allSongs];
      activePlaylistName = "Todas";
      currentPlaylistTag.classList.add('hidden');
      const idx = activePlaylist.findIndex(t => t.fileName === fileName);
      if (idx !== -1) {
        loadTrack(idx);
        playAudio();
      }
    }

    function renderPlaylistsList() {
      const query = searchInput.value.toLowerCase().trim();
      const filtered = customPlaylists.filter(p => p.name.toLowerCase().includes(query));

      trackCountEl.textContent = customPlaylists.length;
      trackListEl.innerHTML = '';

      if (filtered.length === 0) {
        emptyStateEl.classList.remove('hidden');
        return;
      }
      emptyStateEl.classList.add('hidden');

      filtered.forEach((pl) => {
        const isPlayingThis = activePlaylistName === pl.name;

        const li = document.createElement('li');
        li.className = `p-3 rounded-xl flex items-center justify-between border ${
          isPlayingThis ? 'bg-blue-950/40 border-blue-600/50' : 'bg-zinc-950 border-zinc-900'
        }`;

        li.innerHTML = `
          <div class="flex items-center space-x-3 overflow-hidden flex-1">
            <div class="w-10 h-10 rounded-lg bg-zinc-900 border border-zinc-800 text-blue-500 flex items-center justify-center font-bold">
              📁
            </div>
            <div class="overflow-hidden">
              <p class="text-sm font-bold text-zinc-200 truncate">${escapeHtml(pl.name)}</p>
              <p class="text-xs text-zinc-500">${pl.songFileNames.length} músicas</p>
            </div>
          </div>
          <div class="flex items-center space-x-2">
            <button class="btn-play-pl p-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-semibold">
              <i class="fa-solid fa-play mr-1"></i> Tocar
            </button>
            <button class="btn-delete-pl p-2 text-zinc-600 hover:text-red-500 rounded-lg">
              <i class="fa-solid fa-trash-can text-sm"></i>
            </button>
          </div>
        `;

        li.querySelector('.btn-play-pl').addEventListener('click', () => playCustomPlaylist(pl));
        li.querySelector('.btn-delete-pl').addEventListener('click', () => deleteCustomPlaylist(pl.name));

        trackListEl.appendChild(li);
      });
    }

    function playCustomPlaylist(pl) {
      const songsToPlay = allSongs.filter(s => pl.songFileNames.includes(s.fileName));
      if (songsToPlay.length === 0) {
        alert("Nenhuma música válida encontrada nesta playlist!");
        return;
      }
      activePlaylist = songsToPlay;
      activePlaylistName = pl.name;
      currentPlaylistTag.textContent = `Playlist: ${pl.name}`;
      currentPlaylistTag.classList.remove('hidden');

      loadTrack(0);
      playAudio();
      toggleDrawer(false);
    }

    async function deleteCustomPlaylist(name) {
      await deletePlaylistFromDB(name);
      customPlaylists = customPlaylists.filter(p => p.name !== name);
      if (activePlaylistName === name) {
        activePlaylist = [...allSongs];
        activePlaylistName = "Todas";
        currentPlaylistTag.classList.add('hidden');
      }
      renderCurrentView();
    }

    btnOpenModal.addEventListener('click', () => {
      playlistNameInput.value = '';
      modalSongSelection.innerHTML = '';

      if (allSongs.length === 0) {
        modalSongSelection.innerHTML = '<p class="text-xs text-zinc-600 p-2">Nenhuma música importada no player.</p>';
      } else {
        allSongs.forEach(song => {
          const div = document.createElement('div');
          div.className = "flex items-center justify-between p-2 hover:bg-zinc-900 rounded-lg cursor-pointer";
          div.innerHTML = `
            <span class="text-xs text-zinc-300 truncate max-w-[80%]">${escapeHtml(song.title)}</span>
            <input type="checkbox" value="${escapeHtml(song.fileName)}" class="playlist-song-checkbox accent-blue-600 w-4 h-4 cursor-pointer">
          `;
          div.addEventListener('click', (e) => {
            if (e.target.tagName !== 'INPUT') {
              const chk = div.querySelector('input');
              chk.checked = !chk.checked;
            }
          });
          modalSongSelection.appendChild(div);
        });
      }

      playlistModal.classList.remove('hidden');
    });

    const closeModal = () => playlistModal.classList.add('hidden');
    btnCloseModal.addEventListener('click', closeModal);
    btnCancelModal.addEventListener('click', closeModal);

    btnSavePlaylist.addEventListener('click', async () => {
      const name = playlistNameInput.value.trim();
      if (!name) {
        alert("Digite um nome para a playlist!");
        return;
      }

      const checkboxes = modalSongSelection.querySelectorAll('.playlist-song-checkbox:checked');
      const selectedFiles = Array.from(checkboxes).map(c => c.value);

      if (selectedFiles.length === 0) {
        alert("Selecione pelo menos uma música para criar a playlist!");
        return;
      }

      const newPlaylist = {
        name: name,
        songFileNames: selectedFiles
      };

      await savePlaylistToDB(newPlaylist);
      
      const existingIdx = customPlaylists.findIndex(p => p.name === name);
      if (existingIdx !== -1) {
        customPlaylists[existingIdx] = newPlaylist;
      } else {
        customPlaylists.push(newPlaylist);
      }

      closeModal();
      if (currentViewTab === 'playlists') renderCurrentView();
    });

    async function deleteTrack(fileName) {
      const indexToDelete = allSongs.findIndex(t => t.fileName === fileName);
      if (indexToDelete === -1) return;

      if (allSongs[indexToDelete].url) {
        URL.revokeObjectURL(allSongs[indexToDelete].url);
      }

      await deleteSongFromDB(fileName);
      allSongs.splice(indexToDelete, 1);

      customPlaylists.forEach(pl => {
        pl.songFileNames = pl.songFileNames.filter(f => f !== fileName);
        savePlaylistToDB(pl);
      });

      activePlaylist = activePlaylist.filter(t => t.fileName !== fileName);

      if (activePlaylist.length === 0) {
        currentTrackIndex = -1;
        audio.pause();
        audio.src = '';
        trackTitleEl.textContent = 'Nenhuma Música';
        trackArtistEl.textContent = 'Importe seus arquivos MP3/WAV';
        updatePlayState(false);
        seekBar.value = 0;
        currentTimeEl.textContent = '0:00';
        totalDurationEl.textContent = '0:00';
      } else {
        if (currentTrackIndex >= activePlaylist.length) currentTrackIndex = 0;
        loadTrack(currentTrackIndex);
        playAudio();
      }

      renderCurrentView();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function loadTrack(index) {
      if (index < 0 || index >= activePlaylist.length) return;
      currentTrackIndex = index;
      const track = activePlaylist[currentTrackIndex];

      audio.src = track.url;
      audio.playbackRate = parseFloat(speedSelect.value);
      trackTitleEl.textContent = track.title;
      trackArtistEl.textContent = track.artist;

      albumCover.className = `w-full h-full rounded-2xl bg-gradient-to-br ${track.gradient || 'from-zinc-900 via-zinc-950 to-black'} flex flex-col items-center justify-center relative overflow-hidden border border-zinc-800/60 album-pulse`;

      renderCurrentView();
    }

    function playAudio() {
      if (currentTrackIndex === -1 && activePlaylist.length > 0) {
        loadTrack(0);
      }
      if (!audio.src) return;
      audio.play().then(() => updatePlayState(true)).catch(err => console.log(err));
    }

    function pauseAudio() {
      audio.pause();
      updatePlayState(false);
    }

    function updatePlayState(isPlaying) {
      const currentTrack = activePlaylist[currentTrackIndex];
      const iconClass = currentTrack ? (currentTrack.icon || 'fa-music') : 'fa-music';

      if (isPlaying) {
        playIcon.className = 'fa-solid fa-pause';
        headerDisc.style.animationPlayState = 'running';
        albumIcon.className = `fa-solid ${iconClass} fa-spin text-6xl sm:text-7xl text-blue-500 duration-1000`;
        startVisualizer();
      } else {
        playIcon.className = 'fa-solid fa-play ml-1';
        headerDisc.style.animationPlayState = 'paused';
        albumIcon.className = `fa-solid ${iconClass} text-6xl sm:text-7xl text-zinc-700`;
        stopVisualizer();
      }
      renderCurrentView();
    }

    btnPlayPause.addEventListener('click', () => {
      if (audio.paused) playAudio();
      else pauseAudio();
    });

    btnNext.addEventListener('click', playNext);
    btnPrev.addEventListener('click', playPrev);

    function playNext() {
      if (activePlaylist.length === 0) return;
      if (isShuffle) {
        let randomIndex = Math.floor(Math.random() * activePlaylist.length);
        if (activePlaylist.length > 1 && randomIndex === currentTrackIndex) {
          randomIndex = (randomIndex + 1) % activePlaylist.length;
        }
        loadTrack(randomIndex);
      } else {
        let nextIndex = currentTrackIndex + 1;
        if (nextIndex >= activePlaylist.length) nextIndex = 0;
        loadTrack(nextIndex);
      }
      playAudio();
    }

    function playPrev() {
      if (activePlaylist.length === 0) return;
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
        return;
      }
      let prevIndex = currentTrackIndex - 1;
      if (prevIndex < 0) prevIndex = activePlaylist.length - 1;
      loadTrack(prevIndex);
      playAudio();
    }

    btnShuffle.addEventListener('click', () => {
      isShuffle = !isShuffle;
      btnShuffle.className = isShuffle 
        ? 'text-blue-500 transition text-sm p-2 active:scale-95' 
        : 'text-zinc-500 hover:text-zinc-200 transition text-sm p-2 active:scale-95';
    });

    btnRepeat.addEventListener('click', () => {
      repeatState = (repeatState + 1) % 3;
      if (repeatState === 0) {
        btnRepeat.className = 'text-zinc-500 hover:text-zinc-200 transition text-sm p-2 relative active:scale-95';
        repeatBadge.classList.add('hidden');
      } else if (repeatState === 1) {
        btnRepeat.className = 'text-blue-500 transition text-sm p-2 relative active:scale-95';
        repeatBadge.classList.add('hidden');
      } else if (repeatState === 2) {
        btnRepeat.className = 'text-blue-500 transition text-sm p-2 relative active:scale-95';
        repeatBadge.classList.remove('hidden');
      }
    });

    audio.addEventListener('ended', () => {
      if (repeatState === 2) {
        audio.currentTime = 0;
        playAudio();
      } else if (repeatState === 1) {
        playNext();
      } else {
        if (currentTrackIndex < activePlaylist.length - 1) {
          playNext();
        } else {
          pauseAudio();
        }
      }
    });

    audio.addEventListener('timeupdate', () => {
      if (isNaN(audio.duration)) return;
      const progress = (audio.currentTime / audio.duration) * 100;
      seekBar.value = progress || 0;
      currentTimeEl.textContent = formatTime(audio.currentTime);
      totalDurationEl.textContent = formatTime(audio.duration);
    });

    seekBar.addEventListener('input', () => {
      if (!audio.duration) return;
      audio.currentTime = (seekBar.value / 100) * audio.duration;
    });

    volumeBar.addEventListener('input', () => {
      audio.volume = volumeBar.value;
      updateVolumeIcon(audio.volume);
    });

    btnMute.addEventListener('click', () => {
      if (audio.volume > 0) {
        lastVolume = audio.volume;
        audio.volume = 0;
        volumeBar.value = 0;
      } else {
        audio.volume = lastVolume;
        volumeBar.value = lastVolume;
      }
      updateVolumeIcon(audio.volume);
    });

    function updateVolumeIcon(vol) {
      if (vol == 0) volumeIcon.className = 'fa-solid fa-volume-xmark text-red-500';
      else if (vol < 0.5) volumeIcon.className = 'fa-solid fa-volume-low text-zinc-400';
      else volumeIcon.className = 'fa-solid fa-volume-high text-zinc-400';
    }

    speedSelect.addEventListener('change', () => {
      audio.playbackRate = parseFloat(speedSelect.value);
    });

    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function startVisualizer() {
      stopVisualizer();
      vizInterval = setInterval(() => {
        vizBars.forEach(bar => {
          const height = Math.floor(Math.random() * 32) + 6;
          bar.style.height = `${height}px`;
        });
      }, 100);
    }

    function stopVisualizer() {
      if (vizInterval) clearInterval(vizInterval);
      vizBars.forEach(bar => bar.style.height = '4px');
    }

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') {
        e.preventDefault();
        btnPlayPause.click();
      } else if (e.code === 'ArrowRight') {
        audio.currentTime += 5;
      } else if (e.code === 'ArrowLeft') {
        audio.currentTime -= 5;
      }
    });

    window.onload = () => initIndexedDB();
  </script>
</body>
</html>
